# Builds a MennoTeX release for Apple Silicon: mtx, and TeX Live's programs
# (texlive-source + kpathsea on-demand patch). Manual only (decided while
# the repository was private and macOS minutes were billed at 10x).
#
# Reuse, from cheapest to dearest:
# - unchanged texlive-source revision, patches and build script: the
#   programs archive of an earlier release with the same name;
# - else the build tree of an earlier run (actions/cache): exact sources,
#   nothing to build; same revision and build script but other patches,
#   an incremental build (minutes); otherwise a full build (~20 minutes);
# - Rust's dependencies (rust-cache).
#
# With `release`, the run creates a *draft* release tagged
# mennotex-<TeX Live release>-<commit>. It is signed on the maintainer's
# Mac and published with tools/sign_release.sh (decision 0011); mtx only
# installs signed releases.
name: Build TeX Live binaries

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a draft release (sign and publish it with tools/sign_release.sh)"
        type: boolean
        default: false
      rebuild:
        description: "Rebuild TeX Live's programs even if a release has them already"
        type: boolean
        default: false

permissions:
  contents: write  # reading releases to reuse programs; drafting a release

jobs:
  build:
    runs-on: macos-15  # arm64
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Name this build
        run: |
          set -eu
          release=$(sed -n 's/^pub const RELEASE: u32 = \([0-9]*\);.*/\1/p' crates/mtx-core/src/root.rs)
          rev=$(cut -c1-9 build/texlive-source.rev)
          # The programs depend on texlive-source's revision, the patches and
          # the build script, so their archive is named after all three.
          patches=$(git rev-parse HEAD:kpathsea-ondemand/mtx-ondemand.c HEAD:kpathsea-ondemand/patches HEAD:build | shasum | cut -c1-8)
          commit=$(git rev-parse --short=9 HEAD)
          {
            echo "RELEASE=$release"
            echo "BIN=mennotex-bin-$release-$rev.$patches-arm64-darwin"
            echo "SRC=mennotex-src-$release-$rev.$patches"
            echo "MTX=mtx-$release-$commit-arm64-darwin"
            echo "TAG=mennotex-$release-$commit"
            echo "MTX_COMMIT=$commit"
            echo "MTX_COMMIT_TIME=$(git log -1 --format=%ct)"
            echo "TL_REV=$rev"
            echo "TL_SRC=$RUNNER_TEMP/texlive-source"
          } >> "$GITHUB_ENV"
          mkdir dist

      - name: Reuse TeX Live's programs from an earlier release
        if: ${{ !inputs.rebuild }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          from=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(any(.assets[]; .name == \"$BIN.tar.xz\")) | .tag_name" | head -1)
          if [ -z "$from" ]; then echo "no release has $BIN; building"; exit 0; fi
          mkdir reuse
          gh release download "$from" -R "$GITHUB_REPOSITORY" -D reuse -p "$BIN.tar.xz" -p "$SRC.tar.xz" -p SHA256SUMS
          (cd reuse && grep -E "  ($BIN|$SRC)\.tar\.xz\$" SHA256SUMS | shasum -a 256 -c -)
          mv "reuse/$BIN.tar.xz" dist/
          if [ -f "reuse/$SRC.tar.xz" ]; then mv "reuse/$SRC.tar.xz" dist/; fi
          echo "REUSED=$from" >> "$GITHUB_ENV"

      # The configured and built tree (source, Work/, inst/), keyed by what
      # the programs are made from. The restore key falls back to the newest
      # tree of the same revision and build script.
      - name: Restore TeX Live's build tree
        id: tlcache
        if: ${{ !env.REUSED }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/texlive-source
          key: tl-${{ env.TL_REV }}-${{ hashFiles('build/**') }}-${{ hashFiles('kpathsea-ondemand/mtx-ondemand.c', 'kpathsea-ondemand/patches/**') }}
          restore-keys: tl-${{ env.TL_REV }}-${{ hashFiles('build/**') }}-

      - name: Fetch texlive-source at the pinned revision
        if: ${{ !env.REUSED && !steps.tlcache.outputs.cache-matched-key }}
        run: |
          git init -q "$TL_SRC"
          cd "$TL_SRC"
          git remote add origin https://github.com/TeX-Live/texlive-source.git
          git fetch -q --depth 1 origin "$(cat "$GITHUB_WORKSPACE/build/texlive-source.rev")"
          git checkout -q FETCH_HEAD

      - name: Build TeX Live's programs
        if: ${{ !env.REUSED }}
        run: |
          set -eu
          if [ "${{ steps.tlcache.outputs.cache-hit }}" = true ]; then
            echo "build tree of exactly these sources restored; nothing to build"
          elif [ -n "${{ steps.tlcache.outputs.cache-matched-key }}" ]; then
            # An earlier build of this revision with other patches: undo them
            # (tracked files only; Work/ keeps its objects), apply ours and
            # rebuild what they touch. The restored files have new inodes, so
            # git's index no longer matches their stat data and a plain
            # checkout rewrites every tracked file (new mtimes: a full
            # rebuild, and ICU's "config.status has become stale"). Refresh
            # the index first, so only files that really differ are restored.
            git -C "$TL_SRC" update-index -q --refresh || true
            git -C "$TL_SRC" checkout -q -- .
            build/build-texlive.sh "$TL_SRC" --incremental
          else
            build/build-texlive.sh "$TL_SRC"
          fi

      - name: Save TeX Live's build tree
        if: ${{ !env.REUSED && steps.tlcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/texlive-source
          key: ${{ steps.tlcache.outputs.cache-primary-key }}

      - name: Unit tests of the kpathsea patch
        if: ${{ !env.REUSED }}
        run: tests/run_c_tests.sh "$TL_SRC"

      - name: Check the programs
        if: ${{ !env.REUSED }}
        run: |
          set -eu
          test "$(cat "$TL_SRC/Work/exitstatus.txt")" = 0
          bin=$(ls -d "$TL_SRC"/inst/bin/*/)
          for p in pdftex xetex luahbtex kpsewhich dvipdfmx; do
            "$bin$p" --version | head -1
            strings "$bin$p" | grep -q MTX_AUTOINSTALL || { echo "$p lacks the on-demand patch"; exit 1; }
            if otool -L "$bin$p" | tail -n +2 | grep -vE '/usr/lib/|/System/Library/'; then
              echo "$p links non-system libraries"; exit 1
            fi
          done
          "$bin/pdftex" --version | grep -q "TeX Live $RELEASE" || { echo "not TeX Live $RELEASE"; exit 1; }
          echo "BIN_DIR=$bin" >> "$GITHUB_ENV"

      - name: Package TeX Live's programs
        if: ${{ !env.REUSED }}
        run: |
          set -eu
          mkdir -p "dist/$BIN"
          for f in "$BIN_DIR"*; do
            if [ -f "$f" ] && [ ! -L "$f" ] && file "$f" | grep -q Mach-O; then cp "$f" "dist/$BIN/"; fi
          done
          # License texts and the changes to TeX Live go with the binaries
          # (decision 0008); the full source is attached to a release.
          cp build/texlive-source.rev LICENSING.md LICENSE-MIT LICENSE-APACHE "dist/$BIN/"
          cp -R kpathsea-ondemand "dist/$BIN/"
          cp "$TL_SRC/texk/kpathsea/COPYING.LESSERv2" "$TL_SRC/texk/web2c/pdftexdir/COPYINGv2" "dist/$BIN/"
          # Every license and copyright file of texlive-source, at its path
          # there: some programs are GPL-3 (dvisvgm, dvipng), and the bundled
          # libraries (ICU, FreeType, libpng, zlib, ...) ask for their notices
          # to go with the binaries.
          git -C "$TL_SRC" archive --prefix=licenses/ "$(cat build/texlive-source.rev)" -- \
            ':(icase,glob)**/copying*' ':(icase,glob)**/licen[cs]e*' ':(icase,glob)**/copyright*' \
            | tar -x -C "dist/$BIN"
          test -s "dist/$BIN/licenses/libs/icu/icu-src/LICENSE"
          tar -C dist -cJf "dist/$BIN.tar.xz" "$BIN"
          rm -rf "dist/$BIN"

      - name: Package the corresponding source
        if: ${{ !env.REUSED && inputs.release }}
        run: |
          set -eu
          # The GPL's corresponding source: texlive-source at the pinned
          # revision as committed (the build patched only the working tree),
          # plus MennoTeX's patches, build script and this workflow.
          git -C "$TL_SRC" archive --prefix="$SRC/texlive-source/" -o "$PWD/dist/tl.tar" "$(cat build/texlive-source.rev)"
          git archive --prefix="$SRC/" -o dist/mtx.tar HEAD \
            kpathsea-ondemand build LICENSING.md LICENSE-MIT LICENSE-APACHE README.md .github/workflows/build-binaries.yml
          tar -cJf "dist/$SRC.tar.xz" @dist/tl.tar @dist/mtx.tar
          rm dist/tl.tar dist/mtx.tar

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # Third-party: pinned to a commit (v2.9.2). It gets no token: GH_TOKEN
      # is set only on the steps that run gh.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and test mtx
        run: |
          set -eu
          cargo build --release --locked
          cargo test --release --locked
          ./target/release/mtx --version | grep -q "$MTX_COMMIT"

      - name: Package mtx
        run: |
          set -eu
          mkdir "dist/$MTX"
          cp target/release/mtx LICENSE-MIT LICENSE-APACHE LICENSING.md "dist/$MTX/"
          printf 'release=%s\ncommit=%s\ncommit_time=%s\nbinaries=%s\n' \
            "$RELEASE" "$MTX_COMMIT" "$MTX_COMMIT_TIME" "$BIN" > "dist/$MTX/VERSION"
          tar -C dist -cJf "dist/$MTX.tar.xz" "$MTX"
          rm -rf "dist/$MTX"
          (cd dist && shasum -a 256 *.tar.xz > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: |
            dist/${{ env.BIN }}.tar.xz
            dist/${{ env.MTX }}.tar.xz
            dist/SHA256SUMS

      - name: Create a draft release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -f "dist/$SRC.tar.xz" || { echo "no corresponding source for $BIN (reused from ${REUSED:-?} without one); rerun with rebuild"; exit 1; }
          gh release create "$TAG" dist/*.tar.xz dist/SHA256SUMS --draft --title "$TAG" \
            --notes "MennoTeX for TeX Live $RELEASE: mtx built from commit $MTX_COMMIT, and TeX Live's programs ($BIN${REUSED:+, as in $REUSED}) built from texlive-source $(cat build/texlive-source.rev) with MennoTeX's kpathsea on-demand patch. Update with \`mtx self-update\`. Signed: SHA256SUMS.minisig (minisign). Licenses: LICENSING.md in the archives; most programs are GPL-2.0-or-later. $SRC.tar.xz is the corresponding source."
